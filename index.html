<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Rashed & Jerin — Wedding Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Cormorant+Garamond:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-950:#170510;
    --maroon-900:#22081a;
    --maroon-800:#3a0f28;
    --wine-600:#7a1f3d;
    --wine-500:#9c2a4c;
    --gold-300:#f3d9a8;
    --gold-400:#e8c17e;
    --gold-500:#cf9f52;
    --blush-200:#f8e0d0;
    --ivory-50:#fff8f0;
    --card-h: clamp(38px, 11vw, 76px);
    --card-w: clamp(27px, 7.6vw, 56px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; overflow-x:hidden; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  body{
    min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(1200px 800px at 15% -10%, rgba(207,159,82,0.16), transparent 60%),
      radial-gradient(1000px 700px at 110% 110%, rgba(122,31,61,0.35), transparent 60%),
      linear-gradient(160deg, var(--maroon-950) 0%, var(--maroon-900) 35%, var(--wine-600) 70%, var(--maroon-900) 100%);
    background-attachment:fixed;
    font-family:'Poppins', sans-serif;
    display:flex; align-items:center; justify-content:center;
    position:relative; color:var(--ivory-50); text-align:center;
    padding: 28px 16px;
  }

  /* ---------- ambient florals & hearts ---------- */
  .floaty{
    position:fixed; bottom:-8%; pointer-events:none; z-index:1;
    animation: riseFlicker linear infinite;
    opacity:0;
  }
  @keyframes riseFlicker{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.85; }
    50%{ transform:translateY(-55vh) translateX(14px) rotate(90deg); }
    90%{ opacity:.55; }
    100%{ transform:translateY(-108vh) translateX(-10px) rotate(180deg); opacity:0; }
  }

  /* petals drifting down from the top for a bridal feel */
  .petal{
    position:fixed; top:-6%; pointer-events:none; z-index:1;
    animation: petalFall linear infinite;
    opacity:0;
  }
  @keyframes petalFall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.9; }
    50%{ transform:translateY(50vh) translateX(-24px) rotate(180deg); }
    90%{ opacity:.6; }
    100%{ transform:translateY(106vh) translateX(18px) rotate(360deg); opacity:0; }
  }

  /* ---------- rotating mandala behind card ---------- */
  .mandala{
    position:absolute; z-index:0; pointer-events:none;
    width:min(640px, 130vw); height:min(640px, 130vw);
    top:50%; left:50%; transform:translate(-50%,-50%);
    animation: spin 90s linear infinite;
    opacity:0.16;
  }
  .mandala.reverse{ animation-duration:130s; animation-direction:reverse; opacity:0.10; }
  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

  /* ---------- frame ---------- */
  .stage{ position:relative; width:100%; max-width:480px; perspective:1200px; }

  .frame{
    position:relative; z-index:3; width:100%;
    background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-radius:26px;
    padding:42px 18px 32px;
    box-shadow:
      0 25px 70px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.22);
    border:1px solid rgba(232,193,126,0.4);
    animation: revealCard 1.2s cubic-bezier(0.22,1,0.36,1);
    transform-style:preserve-3d;
    will-change: transform;
    transition: transform .25s ease;
    overflow:hidden;
  }
  /* inner hairline border for an invitation-card look */
  .frame::before{
    content:'';
    position:absolute; inset:9px;
    border:1px solid rgba(232,193,126,0.32);
    border-radius:18px;
    pointer-events:none;
    z-index:0;
  }
  .frame > *{ position:relative; z-index:1; }
  @keyframes revealCard{
    0%{ transform:translateY(34px) scale(0.93) rotateX(0); opacity:0; }
    100%{ transform:translateY(0) scale(1) rotateX(0); opacity:1; }
  }

  .corner{
    position:absolute; width:50px; height:50px; opacity:0.85; z-index:1;
    stroke:var(--gold-400); fill:none; stroke-width:1.3;
  }
  .corner path{ stroke-dasharray:260; stroke-dashoffset:260; animation:drawCorner 1.8s ease forwards .3s; }
  .corner circle{ fill:var(--gold-400); stroke:none; opacity:0; animation:fadeUp .6s ease forwards 1.8s; }
  .corner.tl{ top:12px; left:12px; }
  .corner.tr{ top:12px; right:12px; transform:scaleX(-1); }
  .corner.bl{ bottom:12px; left:12px; transform:scaleY(-1); }
  .corner.br{ bottom:12px; right:12px; transform:scale(-1,-1); }
  @keyframes drawCorner{ to{ stroke-dashoffset:0; } }

  /* monogram crest */
  .crest{
    width:76px; height:76px; margin:0 auto 6px;
    opacity:0; animation:fadeUp .9s ease forwards .2s;
  }
  .crest text{
    font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
    fill:url(#crestGrad); font-size:19px;
  }

  .ornament-top{
    font-size:0.8rem; letter-spacing:10px; color:var(--gold-400);
    opacity:0; animation:fadeUp .8s ease forwards .05s;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  .label-top{
    font-size:0.68rem; text-transform:uppercase; letter-spacing:4.5px;
    color:var(--blush-200); opacity:0; margin-bottom:14px;
    animation:fadeUp .8s ease forwards .45s;
  }

  .names{
    font-family:'Playfair Display', serif;
    font-size:clamp(1.9rem, 8.4vw, 2.7rem);
    font-weight:700; line-height:1.2;
    display:flex; align-items:center; justify-content:center;
    gap:14px; flex-wrap:wrap;
    opacity:0; animation:fadeUp .9s ease forwards .55s;
  }
  .names .name{
    background:linear-gradient(100deg, var(--gold-300) 0%, #fff 25%, var(--gold-400) 50%, #fff 75%, var(--gold-300) 100%);
    background-size:250% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine{ to{ background-position:250% center; } }

  .beating-heart{
    display:inline-block; font-size:clamp(1.4rem, 6vw, 1.9rem);
    animation: beat 1.2s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(255,90,120,0.75));
  }
  @keyframes beat{ 0%,100%{ transform:scale(1);} 25%{ transform:scale(1.24);} 40%{ transform:scale(0.94);} 60%{ transform:scale(1.14);} }

  .divider{
    width:0; height:1px; margin:18px auto;
    background:linear-gradient(90deg, transparent, var(--gold-400), transparent);
    animation: growLine 1s ease forwards .8s;
  }
  @keyframes growLine{ to{ width:84px; } }
  .divider::before{ content:'❀'; display:block; margin:0 auto; color:var(--gold-400); font-size:.85rem; transform:translateY(-11px); }

  /* faint floral watermark inside the card, invitation-stationery style */
  .watermark{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    opacity:0.06;
  }

  .wedding-date{
    font-size:0.98rem; letter-spacing:1.6px; color:var(--gold-300);
    opacity:0; animation:fadeUp .8s ease forwards .9s;
  }

  .quote{
    margin-top:10px; font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:1.02rem; opacity:0; line-height:1.55; color:var(--blush-200);
    animation:fadeUp .8s ease forwards 1.05s;
  }

  /* ---------- flip clock ---------- */
  .countdown{
    margin-top:32px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px;
    opacity:0; animation:fadeUp .9s ease forwards 1.2s;
  }
  .unit{ display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0; }

  .flip-group{ display:flex; gap:3px; }

  .flip-card{
    position:relative; width:var(--card-w); height:var(--card-h);
    perspective:300px;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,0.35));
  }
  .flip-card .half{
    position:absolute; left:0; width:100%; height:50%; overflow:hidden;
    background:linear-gradient(180deg, #fdf3e2, #f3ddb8);
    color:var(--maroon-900);
    font-family:'Playfair Display', serif; font-weight:800;
    font-size:clamp(0.95rem, 5.2vw, 2rem);
    font-variant-numeric:tabular-nums;
  }
  .flip-card .half span{
    position:absolute; left:0; width:100%; height:var(--card-h);
    display:flex; align-items:center; justify-content:center;
  }
  .flip-card .top{ top:0; border-radius:7px 7px 0 0; border-bottom:1px solid rgba(0,0,0,0.28); }
  .flip-card .top span{ top:0; }
  .flip-card .bottom{ bottom:0; border-radius:0 0 7px 7px; background:linear-gradient(180deg,#f3ddb8,#e9c98c); }
  .flip-card .bottom span{ top:calc(var(--card-h) * -0.5); }

  .flip-card .flip-top, .flip-card .flip-bottom{
    position:absolute; left:0; width:100%; height:50%; overflow:hidden;
    backface-visibility:hidden; z-index:2;
  }
  .flip-card .flip-top{
    top:0; border-radius:7px 7px 0 0; transform-origin:bottom;
    background:linear-gradient(180deg, #fdf3e2, #f3ddb8);
    border-bottom:1px solid rgba(0,0,0,0.28);
  }
  .flip-card .flip-bottom{
    bottom:0; border-radius:0 0 7px 7px; transform-origin:top;
    background:linear-gradient(180deg,#f3ddb8,#e9c98c);
  }
  .flip-card .flip-top span, .flip-card .flip-bottom span{
    position:absolute; left:0; width:100%; height:var(--card-h);
    display:flex; align-items:center; justify-content:center;
    font-family:'Playfair Display', serif; font-weight:800;
    font-size:clamp(0.95rem, 5.2vw, 2rem); color:var(--maroon-900);
    font-variant-numeric:tabular-nums;
  }
  .flip-card .flip-top span{ top:0; }
  .flip-card .flip-bottom span{ top:calc(var(--card-h) * -0.5); }

  .flip-card.playing .flip-top{ animation: flipTop .3s cubic-bezier(.5,0,.8,.4) forwards; }
  .flip-card.playing .flip-bottom{ animation: flipBottom .3s cubic-bezier(.2,.6,.4,1) .3s forwards; }
  @keyframes flipTop{ to{ transform:rotateX(-90deg); } }
  @keyframes flipBottom{ from{ transform:rotateX(90deg); } to{ transform:rotateX(0deg); } }

  .colon{ font-family:'Playfair Display', serif; font-size:1.6rem; color:var(--gold-400); align-self:center; opacity:.7; }

  .time-label{
    font-size:0.62rem; text-transform:uppercase; letter-spacing:1.6px;
    color:var(--blush-200); opacity:0.9;
  }

  /* ---------- progress ---------- */
  .progress-wrap{ margin-top:30px; opacity:0; animation:fadeUp .9s ease forwards 1.35s; }
  .progress-bar{
    position:relative; width:100%; height:10px; border-radius:10px;
    background:rgba(255,255,255,0.10); overflow:hidden;
    border:1px solid rgba(232,193,126,0.3);
  }
  .progress-fill{
    height:100%; border-radius:10px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-300), var(--gold-500));
    background-size:200% 100%;
    animation: shimmer 3s linear infinite;
    width:0%; transition:width 1s ease;
    position:relative;
  }
  .progress-fill::after{
    content:'❖'; position:absolute; right:-7px; top:50%; transform:translateY(-50%);
    font-size:.65rem; color:var(--ivory-50);
  }
  @keyframes shimmer{ 0%{ background-position:0% 50%;} 100%{ background-position:200% 50%;} }

  .progress-text{
    margin-top:9px; font-size:0.76rem; opacity:0.85; letter-spacing:0.4px;
  }

  .ornament-bottom{
    margin-top:28px; font-size:1.1rem; color:var(--gold-400); opacity:0.6; letter-spacing:8px;
    opacity:0; animation:fadeUp .8s ease forwards 1.5s;
  }
  .footer-msg{
    margin-top:8px; font-size:0.68rem; opacity:0.55; letter-spacing:1px;
    opacity:0; animation:fadeUp .8s ease forwards 1.6s;
  }

  .celebration{
    font-family:'Playfair Display', serif;
    font-size:clamp(1.5rem, 7vw, 2.1rem); font-weight:700; color:var(--gold-300);
    animation: pulseGlow 1.6s ease-in-out infinite;
    grid-column:1 / -1;
  }
  @keyframes pulseGlow{ 0%,100%{ text-shadow:0 0 20px rgba(232,193,126,0.6);} 50%{ text-shadow:0 0 42px rgba(232,193,126,1);} }

  /* ---------- desktop / larger screens ---------- */
  @media (min-width:640px){
    :root{ --card-h:92px; --card-w:66px; }
    .stage{ max-width:560px; }
    .frame{ padding:52px 44px 40px; }
    .quote{ font-size:1.12rem; }
    .frame:hover{ transform: rotateX(2deg) rotateY(-2deg); }
  }

  @media (max-width:360px){
    .frame{ padding:36px 14px 26px; border-radius:22px; }
    .countdown{ gap:4px; }
  }
</style>
</head>
<body>

<svg class="mandala" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#e8c17e" stroke-width="0.5">
    <circle cx="100" cy="100" r="90"/>
    <circle cx="100" cy="100" r="70"/>
    <circle cx="100" cy="100" r="50"/>
    <g id="petals"></g>
  </g>
</svg>
<svg class="mandala reverse" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#e8c17e" stroke-width="0.4">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="100" cy="100" r="60"/>
  </g>
</svg>

<div class="stage">
  <div class="frame" id="frame">
    <svg class="corner tl" viewBox="0 0 50 50">
      <path d="M4,44 C4,24 14,8 40,4"/>
      <path d="M14,28 C19,22 27,20 31,25 C27,29 19,31 14,28 Z"/>
      <circle cx="38" cy="6" r="1.8"/>
    </svg>
    <svg class="corner tr" viewBox="0 0 50 50">
      <path d="M4,44 C4,24 14,8 40,4"/>
      <path d="M14,28 C19,22 27,20 31,25 C27,29 19,31 14,28 Z"/>
      <circle cx="38" cy="6" r="1.8"/>
    </svg>
    <svg class="corner bl" viewBox="0 0 50 50">
      <path d="M4,44 C4,24 14,8 40,4"/>
      <path d="M14,28 C19,22 27,20 31,25 C27,29 19,31 14,28 Z"/>
      <circle cx="38" cy="6" r="1.8"/>
    </svg>
    <svg class="corner br" viewBox="0 0 50 50">
      <path d="M4,44 C4,24 14,8 40,4"/>
      <path d="M14,28 C19,22 27,20 31,25 C27,29 19,31 14,28 Z"/>
      <circle cx="38" cy="6" r="1.8"/>
    </svg>

    <svg class="watermark" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="#f3d9a8" stroke-width="0.6">
        <g transform="translate(40,50)"><path d="M0,20 Q10,0 20,20 Q10,40 0,20 Z"/><path d="M20,20 Q30,0 40,20 Q30,40 20,20 Z" transform="rotate(60 20 20)"/></g>
        <g transform="translate(250,120)"><path d="M0,20 Q10,0 20,20 Q10,40 0,20 Z"/><path d="M20,20 Q30,0 40,20 Q30,40 20,20 Z" transform="rotate(60 20 20)"/></g>
        <g transform="translate(30,320)"><path d="M0,20 Q10,0 20,20 Q10,40 0,20 Z"/><path d="M20,20 Q30,0 40,20 Q30,40 20,20 Z" transform="rotate(60 20 20)"/></g>
        <g transform="translate(255,360)"><path d="M0,20 Q10,0 20,20 Q10,40 0,20 Z"/><path d="M20,20 Q30,0 40,20 Q30,40 20,20 Z" transform="rotate(60 20 20)"/></g>
      </g>
    </svg>

    <svg class="crest" viewBox="0 0 90 90">
      <defs>
        <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f3d9a8"/>
          <stop offset="50%" stop-color="#fff"/>
          <stop offset="100%" stop-color="#cf9f52"/>
        </linearGradient>
      </defs>
      <circle cx="45" cy="45" r="41" fill="none" stroke="url(#crestGrad)" stroke-width="1.3"/>
      <circle cx="45" cy="45" r="35" fill="none" stroke="url(#crestGrad)" stroke-width="0.7"/>
      <text x="45" y="52" text-anchor="middle">R &amp; J</text>
      <text x="45" y="66" text-anchor="middle" style="font-family:'Poppins',sans-serif; font-style:normal; font-size:8px; letter-spacing:2px; fill:url(#crestGrad); font-weight:500;">EST. 2026</text>
    </svg>

    <div class="ornament-top">✦ ✦ ✦</div>
    <div class="label-top">Save The Date</div>

    <div class="names">
      <span class="name">Rashed</span>
      <span class="beating-heart">❤️</span>
      <span class="name">Jerin</span>
    </div>

    <div class="divider"></div>

    <div class="wedding-date">Thursday, September 10, 2026</div>
    <div class="quote">"Two hearts, one journey — counting every moment until forever begins."</div>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="flip-group" id="days"></div>
        <div class="time-label">Days</div>
      </div>
      <div class="unit">
        <div class="flip-group" id="hours"></div>
        <div class="time-label">Hours</div>
      </div>
      <div class="unit">
        <div class="flip-group" id="minutes"></div>
        <div class="time-label">Minutes</div>
      </div>
      <div class="unit">
        <div class="flip-group" id="seconds"></div>
        <div class="time-label">Seconds</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0% of the journey to "I Do"</div>
    </div>

    <div class="ornament-bottom">✦ ✦ ✦</div>
    <div class="footer-msg">MADE WITH LOVE FOR RASHED &amp; JERIN'S WEDDING</div>
  </div>
</div>

<script>
  // ================== WEDDING DATE (fixed) ==================
  const targetTime = new Date("2026-09-10T18:00:00+06:00").getTime();
  const startTime = Date.now();
  const totalDuration = targetTime - startTime;
  // =============================================================

  // ---------- build mandala petals ----------
  const petalsGroup = document.getElementById('petals');
  for (let i=0;i<16;i++){
    const angle = (360/16)*i;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M100,10 Q108,30 100,50 Q92,30 100,10 Z');
    p.setAttribute('transform', `rotate(${angle} 100 100)`);
    p.setAttribute('fill', 'none');
    petalsGroup.appendChild(p);
  }

  // ---------- flip clock ----------
  function buildFlipCard(container){
    container.innerHTML = `
      <div class="flip-card">
        <div class="half top"><span>0</span></div>
        <div class="half bottom"><span>0</span></div>
        <div class="flip-top"><span>0</span></div>
        <div class="flip-bottom"><span>0</span></div>
      </div>`;
    return container.querySelector('.flip-card');
  }

  function setDigit(card, digit, animate){
    const topSpan = card.querySelector('.top span');
    const bottomSpan = card.querySelector('.bottom span');
    const flipTopSpan = card.querySelector('.flip-top span');
    const flipBottomSpan = card.querySelector('.flip-bottom span');
    const current = topSpan.textContent;
    if (current === String(digit) && !animate) return;
    if (current === String(digit)) return;

    flipTopSpan.textContent = current;
    flipBottomSpan.textContent = digit;

    card.classList.remove('playing');
    void card.offsetWidth; // restart animation
    card.classList.add('playing');

    setTimeout(()=>{
      topSpan.textContent = digit;
      bottomSpan.textContent = digit;
      card.classList.remove('playing');
    }, 600);
  }

  const groups = {
    days: [buildFlipCard(document.getElementById('days').appendChild(document.createElement('div'))),
           buildFlipCard(document.getElementById('days').appendChild(document.createElement('div')))],
    hours: [buildFlipCard(document.getElementById('hours').appendChild(document.createElement('div'))),
            buildFlipCard(document.getElementById('hours').appendChild(document.createElement('div')))],
    minutes: [buildFlipCard(document.getElementById('minutes').appendChild(document.createElement('div'))),
              buildFlipCard(document.getElementById('minutes').appendChild(document.createElement('div')))],
    seconds: [buildFlipCard(document.getElementById('seconds').appendChild(document.createElement('div'))),
              buildFlipCard(document.getElementById('seconds').appendChild(document.createElement('div')))]
  };

  function updateUnit(cards, value){
    const str = String(Math.max(0,value)).padStart(2,'0');
    setDigit(cards[0], str[0]);
    setDigit(cards[1], str[1]);
  }

  function updateCountdown(){
    const now = Date.now();
    const distance = targetTime - now;

    if (distance <= 0){
      document.getElementById('countdown').innerHTML = "<div class='celebration'>💍 Today is the Day! 💍</div>";
      document.getElementById('progressFill').style.width = "100%";
      document.getElementById('progressText').innerText = '100% — Forever begins today! 🎉';
      clearInterval(timer);
      return;
    }

    const days = Math.floor(distance/(1000*60*60*24));
    const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
    const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
    const seconds = Math.floor((distance%(1000*60))/1000);

    updateUnit(groups.days, days);
    updateUnit(groups.hours, hours);
    updateUnit(groups.minutes, minutes);
    updateUnit(groups.seconds, seconds);

    const elapsed = totalDuration - distance;
    let percent = (elapsed/totalDuration)*100;
    percent = Math.max(0, Math.min(100, percent));
    document.getElementById('progressFill').style.width = percent.toFixed(2)+"%";
    document.getElementById('progressText').innerText = percent.toFixed(1)+'% of the journey to "I Do" 💗';
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);

  // ---------- subtle 3D tilt on desktop ----------
  const frame = document.getElementById('frame');
  const isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (isFinePointer){
    document.addEventListener('mousemove', (e)=>{
      const r = frame.getBoundingClientRect();
      const cx = r.left + r.width/2;
      const cy = r.top + r.height/2;
      const dx = (e.clientX - cx)/r.width;
      const dy = (e.clientY - cy)/r.height;
      frame.style.transform = `rotateX(${(-dy*4).toFixed(2)}deg) rotateY(${(dx*4).toFixed(2)}deg)`;
    });
    document.addEventListener('mouseleave', ()=>{ frame.style.transform = 'rotateX(0) rotateY(0)'; });
  }

  // ---------- rising flowers & hearts ----------
  const risingChars = ['🌸','💕','🌷','💗'];
  function createRising(){
    const el = document.createElement('div');
    el.classList.add('floaty');
    el.innerText = risingChars[Math.floor(Math.random()*risingChars.length)];
    el.style.left = Math.random()*100 + 'vw';
    const duration = 10 + Math.random()*7;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (13 + Math.random()*12) + 'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000);
  }
  setInterval(createRising, 1300);

  // ---------- falling petals ----------
  const petalChars = ['🌸','🌺','💮'];
  function createPetal(){
    const el = document.createElement('div');
    el.classList.add('petal');
    el.innerText = petalChars[Math.floor(Math.random()*petalChars.length)];
    el.style.left = Math.random()*100 + 'vw';
    const duration = 9 + Math.random()*6;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (14 + Math.random()*12) + 'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000);
  }
  setInterval(createPetal, 900);

  // ---------- floating sparkles ----------
  const sparkleChars = ['✦','✧','⭐'];
  function createSparkle(){
    const el = document.createElement('div');
    el.classList.add('floaty');
    el.innerText = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
    el.style.left = Math.random()*100 + 'vw';
    el.style.color = '#f3d9a8';
    const duration = 7 + Math.random()*6;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (9 + Math.random()*10) + 'px';
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), duration*1000);
  }
  setInterval(createSparkle, 600);
</script>
