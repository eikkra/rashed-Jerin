<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#ffe3ec; --pink:#ff7eb6; --berry:#c2185b; --lav:#d9ccff; --butter:#fff1b8; --mint:#c9f2e3; --ink:#4a2040;
  --f:'Fredoka','Trebuchet MS',sans-serif; --hand:'Caveat','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--f);color:var(--ink);background:radial-gradient(circle at 15% 10%,var(--lav) 0,transparent 40%),radial-gradient(circle at 85% 30%,var(--butter) 0,transparent 35%),var(--blush);background-attachment:fixed;overflow-x:hidden}
canvas#c{position:fixed;inset:0;pointer-events:none;z-index:50}
.float{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float span{position:absolute;bottom:-60px;font-size:28px;opacity:.55;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}

/* intro */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--blush);text-align:center;padding:24px;transition:opacity .8s,visibility .8s}
#intro.gone{opacity:0;visibility:hidden}
#intro h1{font-family:var(--hand);font-size:clamp(34px,8vw,52px);color:var(--berry)}
#intro p{font-size:18px}
.gift{all:unset;cursor:pointer;position:relative;width:150px;height:150px;animation:wob 1.6s ease-in-out infinite}
.gift:focus-visible{outline:3px solid var(--berry);outline-offset:8px;border-radius:16px}
.gift .box{position:absolute;bottom:0;left:10px;right:10px;height:95px;background:var(--pink);border-radius:10px}
.gift .lid{position:absolute;bottom:88px;left:0;right:0;height:38px;background:#ff5fa2;border-radius:10px;transform-origin:left bottom;transition:transform .6s}
.gift .rib{position:absolute;bottom:0;left:50%;width:26px;height:126px;margin-left:-13px;background:var(--butter)}
.gift .bow{position:absolute;bottom:118px;left:50%;margin-left:-22px;font-size:44px}
.gift.open .lid{transform:rotate(-55deg) translateY(-14px)}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* main */
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:48px 20px 70px;display:none}
main.show{display:block}
.hero{text-align:center}
.hero .small{font-family:var(--hand);font-size:30px;color:var(--berry)}
.hero h1{font-size:clamp(44px,13vw,86px);line-height:1.02;font-weight:600;color:var(--berry);margin:6px 0 4px}
.hero h1 .nm{display:block;font-family:var(--hand);font-size:1.15em;color:var(--pink);text-shadow:3px 3px 0 #fff}
.age{display:inline-block;margin-top:10px;background:#fff;border-radius:99px;padding:6px 20px;font-weight:500;box-shadow:0 6px 0 var(--lav)}

/* cake */
.cake-wrap{margin:34px auto 0;text-align:center}
.cake{position:relative;width:230px;height:190px;margin:0 auto}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px}
.t1{bottom:0;width:230px;height:70px;background:#ffb3d1;box-shadow:inset 0 14px 0 #fff}
.t2{bottom:70px;width:170px;height:56px;background:var(--lav);box-shadow:inset 0 12px 0 #fff}
.candles{position:absolute;bottom:126px;left:50%;transform:translateX(-50%);display:flex;gap:26px}
.cndl{all:unset;cursor:pointer;position:relative;width:12px;height:42px;background:repeating-linear-gradient(180deg,var(--butter) 0 8px,var(--pink) 8px 16px);border-radius:4px}
.cndl:focus-visible{outline:3px solid var(--berry);outline-offset:4px}
.cndl::before{content:"";position:absolute;left:50%;top:-24px;width:14px;height:22px;margin-left:-7px;background:radial-gradient(ellipse at 50% 70%,#fff 0 20%,#ffd54a 45%,#ff8a3d 100%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:fl .35s ease-in-out infinite alternate;transition:opacity .3s}
.cndl.off::before{opacity:0;animation:none}
@keyframes fl{to{transform:scale(1.12,.92) rotate(4deg)}}
.hint{margin-top:16px;font-family:var(--hand);font-size:26px;color:var(--berry)}

/* cards */
.section-t{font-family:var(--hand);font-size:38px;color:var(--berry);text-align:center;margin:56px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{all:unset;cursor:pointer;display:block;background:#fff;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 7px 0 var(--lav);min-height:150px;transition:transform .2s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.card .em{font-size:40px;display:block;margin-bottom:6px}
.card b{font-weight:600;font-size:19px}
.card .msg{display:none;font-size:16px;line-height:1.45;margin-top:4px}
.card.flip .msg{display:block}
.card.flip .lbl{display:none}
.card:nth-child(2){box-shadow:0 7px 0 var(--butter)}
.card:nth-child(3){box-shadow:0 7px 0 var(--mint)}
.card:nth-child(4){box-shadow:0 7px 0 #ffc2d9}

/* letter */
.letter{background:#fffdf7;border-radius:8px 8px 22px 22px;padding:34px 28px;box-shadow:0 10px 0 var(--butter);transform:rotate(-.6deg);position:relative;font-size:18px;line-height:1.75}
.letter::before{content:"💌";position:absolute;top:-22px;right:24px;font-size:38px}
.letter p+p{margin-top:14px}
.sign{font-family:var(--hand);font-size:34px;color:var(--berry);margin-top:20px;text-align:right}
.again{all:unset;cursor:pointer;display:block;margin:40px auto 0;background:var(--pink);color:#fff;font-weight:600;padding:14px 28px;border-radius:99px;box-shadow:0 6px 0 var(--berry);transition:transform .1s,box-shadow .1s}
.again:active{transform:translateY(5px);box-shadow:0 1px 0 var(--berry)}
.again:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="float" id="float"></div>

<section id="intro">
  <h1>Ekta surprise ache tomar jonno! 🎀</h1>
  <button class="gift" id="gift" aria-label="Open the gift"><span class="box"></span><span class="rib"></span><span class="lid"></span><span class="bow">🎀</span></button>
  <p>Gift box e tap koro</p>
</section>

<main id="main">
  <header class="hero">
    <div class="small">today is all about you</div>
    <h1>Happy Birthday<span class="nm" id="nm"></span></h1>
    <div class="age" id="age"></div>
  </header>

  <div class="cake-wrap">
    <div class="cake">
      <div class="candles" id="candles">
        <button class="cndl" aria-label="Blow out candle"></button>
        <button class="cndl" aria-label="Blow out candle"></button>
        <button class="cndl" aria-label="Blow out candle"></button>
      </div>
      <div class="tier t2"></div><div class="tier t1"></div>
    </div>
    <p class="hint" id="hint">Candle gulo te tap kore fuk dao 🕯️</p>
  </div>

  <h2 class="section-t">Tomar jonno kichu wish 💖</h2>
  <div class="grid" id="cards"></div>

  <h2 class="section-t">Ekta choto chithi</h2>
  <article class="letter">
    <p id="l1"></p><p id="l2"></p><p id="l3"></p>
    <div class="sign" id="sign"></div>
  </article>

  <button class="again" id="again">Abar confetti! 🎉</button>
</main>

<script>
/* ===== Edit these ===== */
const CFG = {
  name: "Zara",           // bon er name / dak name
  from: "Tomar chhoto bhai", // tumi ki hisebe sign korba
  age: "",                // e.g. "Turning 20" (faka rakhle dekhabe na)
  wishes: [
    {e:"🌸", t:"Khushi", m:"Tomar hashi jeno kokhono na thame. Protita din jeno tomar jonno ekta sundor surprise hoy."},
    {e:"🍰", t:"Mishti", m:"Aj joto iccha cake kha, diet kal theke! Ami dekhbo na 😜"},
    {e:"🌈", t:"Sopno", m:"Tomar sob sopno jeno ekdin sotti hoy. Ami sobsomoy pashe achi."},
    {e:"🫶", t:"Bhalobasha", m:"Tumi amar sobcheye bhalo bon. Thank you sob kichur jonno."}
  ],
  letter: [
    "Ei choto website ta shudhu tomar jonno banano. Jani na kemon laglo, kintu tomar chehara ta kalpona kore ami ekhoni hashchi.",
    "Kokhono jhogra kori, kokhono laga lagi kori, kintu tumi amar shob cheye kache r shob cheye bhalo bondhu.",
    "Tomar ei dine amar ekta-i iccha: tumi khub khushi theko, sustho theko, r ami jeno tomar pashe thakte pari."
  ]
};
/* ====================== */

const $ = s => document.querySelector(s);
$('#nm').textContent = CFG.name + " 🎂";
if (CFG.age) $('#age').textContent = CFG.age; else $('#age').style.display = 'none';
$('#sign').textContent = "— " + CFG.from + " 💕";
['l1','l2','l3'].forEach((id,i)=>$('#'+id).textContent = CFG.letter[i]);
CFG.wishes.forEach(w=>{
  const b = document.createElement('button'); b.className='card';
  b.innerHTML = `<span class="em">${w.e}</span><b class="lbl">${w.t}</b><span class="msg">${w.m}</span>`;
  b.onclick = () => { b.classList.toggle('flip'); burst(innerWidth/2, innerHeight/2, 30); };
  $('#cards').appendChild(b);
});

/* floating emoji */
const fl = $('#float'), em = ['🎈','💖','✨','🌸','🎀','⭐'];
for (let i=0;i<14;i++){ const s=document.createElement('span'); s.textContent=em[i%em.length];
  s.style.left=Math.random()*100+'%'; s.style.animationDuration=(9+Math.random()*10)+'s'; s.style.animationDelay=(-Math.random()*14)+'s'; fl.appendChild(s); }

/* confetti */
const cv = $('#c'), cx = cv.getContext('2d'); let P = [];
function size(){ cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
const cols = ['#ff7eb6','#ffd54a','#b9a4ff','#7fe0c0','#ff9a8b','#fff'];
function burst(x,y,n=90){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=4+Math.random()*9;
    P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:4+Math.random()*5,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:140+Math.random()*60}); }
  if (P.length===n) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  P = P.filter(p=>p.life>0 && p.y<cv.height+20);
  P.forEach(p=>{ p.vy+=.22; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.globalAlpha=Math.min(1,p.life/40);
    cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
  if (P.length) requestAnimationFrame(tick);
}

/* open gift */
$('#gift').onclick = e => {
  const g = $('#gift'); g.classList.add('open');
  const r = g.getBoundingClientRect(); burst(r.left+r.width/2, r.top+20, 120);
  setTimeout(()=>{ $('#intro').classList.add('gone'); $('#main').classList.add('show'); scrollTo(0,0); burst(innerWidth/2, innerHeight/3, 120); }, 700);
};

/* candles */
const cs = [...document.querySelectorAll('.cndl')];
cs.forEach(c=>c.onclick = () => {
  c.classList.add('off');
  if (cs.every(x=>x.classList.contains('off'))){
    $('#hint').textContent = "Wish ta mone mone koro... 🤫✨";
    burst(innerWidth/2, innerHeight/2, 160);
  }
});

$('#again').onclick = () => { burst(innerWidth*.25, innerHeight*.6, 90); burst(innerWidth*.75, innerHeight*.6, 90); };
</script>
</body>
</html>
