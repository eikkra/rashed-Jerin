<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rashed & Jerin — Wedding Countdown</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(135deg, #1a0a1f 0%, #3d1730 25%, #6b2545 50%, #8b3a5c 75%, #3d1730 100%);
    background-size: 300% 300%;
    animation: gradientBG 18s ease infinite;
    font-family: 'Georgia', 'Segoe UI', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    color: #fff8f0;
    text-align: center;
    padding: 24px 16px;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Soft gold sparkles floating */
  .sparkle {
    position: fixed;
    top: 100%;
    pointer-events: none;
    user-select: none;
    z-index: 1;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 4px rgba(255,215,150,0.8));
  }

  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    8% { opacity: 1; }
    92% { opacity: 1; }
    100% { transform: translateY(-105vh) translateX(20px) rotate(360deg); opacity: 0; }
  }

  /* Petal fall */
  .petal {
    position: fixed;
    top: -5%;
    pointer-events: none;
    z-index: 1;
    animation: petalFall linear infinite;
    opacity: 0.85;
  }

  @keyframes petalFall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    50% { transform: translateY(50vh) translateX(30px) rotate(180deg); }
    100% { transform: translateY(105vh) translateX(-20px) rotate(360deg); }
  }

  .frame {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 480px;
    background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 28px;
    padding: 38px 24px 30px;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    border: 1px solid rgba(255,215,180,0.35);
    animation: revealCard 1.1s cubic-bezier(0.22,1,0.36,1);
  }

  @keyframes revealCard {
    0% { transform: translateY(30px) scale(0.94); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .ornament-top {
    font-size: 1.6rem;
    letter-spacing: 10px;
    color: #f7c98e;
    opacity: 0.85;
    margin-bottom: 6px;
  }

  .rings {
    font-size: 2.4rem;
    margin: 6px 0 14px;
    animation: sway 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  .label-top {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #f0c9a8;
    opacity: 0.9;
    margin-bottom: 12px;
    font-family: 'Segoe UI', sans-serif;
  }

  .names {
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    font-weight: 700;
    line-height: 1.25;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    font-family: 'Georgia', serif;
  }

  .names .name {
    background: linear-gradient(90deg, #ffe8c9, #ffffff, #ffd9a0);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .beating-heart {
    display: inline-block;
    font-size: clamp(1.5rem, 6vw, 2rem);
    animation: beat 1.15s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,90,120,0.75));
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.22); }
    40% { transform: scale(0.94); }
    60% { transform: scale(1.12); }
  }

  .divider {
    width: 70px;
    height: 2px;
    margin: 16px auto;
    background: linear-gradient(90deg, transparent, #f0c9a8, transparent);
  }

  .wedding-date {
    font-size: 0.98rem;
    letter-spacing: 1.5px;
    color: #ffe4c4;
    font-family: 'Segoe UI', sans-serif;
    margin-bottom: 4px;
  }

  .quote {
    margin-top: 10px;
    font-style: italic;
    font-size: 0.92rem;
    opacity: 0.85;
    font-family: 'Segoe UI', sans-serif;
    line-height: 1.5;
  }

  .countdown {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .time-box {
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
    border-radius: 16px;
    padding: 14px 4px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
    border: 1px solid rgba(255,215,180,0.3);
    transition: transform 0.3s;
  }

  .time-box:active {
    transform: scale(0.96);
  }

  .time-number {
    font-size: clamp(1.5rem, 7vw, 2.1rem);
    font-weight: 800;
    color: #fff6ea;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    font-variant-numeric: tabular-nums;
    font-family: 'Segoe UI', sans-serif;
  }

  .time-label {
    margin-top: 4px;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #f0c9a8;
    opacity: 0.9;
    font-family: 'Segoe UI', sans-serif;
  }

  .progress-wrap {
    margin-top: 28px;
  }

  .progress-bar {
    width: 100%;
    height: 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
    border: 1px solid rgba(255,215,180,0.3);
  }

  .progress-fill {
    height: 100%;
    border-radius: 10px;
    background: linear-gradient(90deg, #f7c98e, #ff9eb5, #f7c98e);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
    width: 0%;
    transition: width 1s ease;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .progress-text {
    margin-top: 8px;
    font-size: 0.78rem;
    opacity: 0.85;
    font-family: 'Segoe UI', sans-serif;
    letter-spacing: 0.5px;
  }

  .ornament-bottom {
    margin-top: 26px;
    font-size: 1.3rem;
    color: #f7c98e;
    opacity: 0.7;
    letter-spacing: 8px;
  }

  .footer-msg {
    margin-top: 10px;
    font-size: 0.72rem;
    opacity: 0.6;
    font-family: 'Segoe UI', sans-serif;
    letter-spacing: 1px;
  }

  .celebration {
    font-size: clamp(1.6rem, 7vw, 2.2rem);
    font-weight: 700;
    color: #ffe4c4;
    font-family: 'Georgia', serif;
    animation: pulseGlow 1.5s ease-in-out infinite;
  }

  @keyframes pulseGlow {
    0%, 100% { text-shadow: 0 0 20px rgba(255,220,150,0.6); }
    50% { text-shadow: 0 0 40px rgba(255,220,150,1); }
  }

  @media (max-width: 360px) {
    .frame { padding: 30px 16px 24px; border-radius: 22px; }
    .countdown { gap: 6px; }
    .time-box { padding: 10px 2px; border-radius: 12px; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="ornament-top">✦ ✦ ✦</div>
  <div class="rings">💍</div>
  <div class="label-top">Save The Date</div>

  <div class="names">
    <span class="name">Rashed</span>
    <span class="beating-heart">❤️</span>
    <span class="name">Jerin</span>
  </div>

  <div class="divider"></div>

  <div class="wedding-date">Friday, September 11, 2026</div>
  <div class="quote">"Two hearts, one journey — counting every moment until forever begins."</div>

  <div class="countdown" id="countdown">
    <div class="time-box">
      <div class="time-number" id="days">00</div>
      <div class="time-label">Days</div>
    </div>
    <div class="time-box">
      <div class="time-number" id="hours">00</div>
      <div class="time-label">Hours</div>
    </div>
    <div class="time-box">
      <div class="time-number" id="minutes">00</div>
      <div class="time-label">Minutes</div>
    </div>
    <div class="time-box">
      <div class="time-number" id="seconds">00</div>
      <div class="time-label">Seconds</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">0% of the journey to "I Do"</div>
  </div>

  <div class="ornament-bottom">✦ ✦ ✦</div>
  <div class="footer-msg">MADE WITH LOVE FOR RASHED &amp; JERIN'S WEDDING</div>
</div>

<script>
  // ================== WEDDING DATE (fixed) ==================
  // September 11, 2026, 6:00 PM (Bangladesh time, UTC+6)
  const targetTime = new Date("2026-09-11T18:00:00+06:00").getTime();
  const startTime = Date.now();
  const totalDuration = targetTime - startTime;
  // =============================================================

  function updateCountdown() {
    const now = Date.now();
    const distance = targetTime - now;

    if (distance <= 0) {
      document.getElementById('countdown').innerHTML =
        "<div class='celebration' style='grid-column: 1 / -1;'>💍 Today is the Day! 💍</div>";
      document.getElementById('progressFill').style.width = "100%";
      document.getElementById('progressText').innerText = "100% — Forever begins today! 🎉";
      clearInterval(timer);
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((distance % (1000*60)) / 1000);

    document.getElementById('days').innerText = String(days).padStart(2,'0');
    document.getElementById('hours').innerText = String(hours).padStart(2,'0');
    document.getElementById('minutes').innerText = String(minutes).padStart(2,'0');
    document.getElementById('seconds').innerText = String(seconds).padStart(2,'0');

    const elapsed = totalDuration - distance;
    let percent = (elapsed / totalDuration) * 100;
    percent = Math.max(0, Math.min(100, percent));
    document.getElementById('progressFill').style.width = percent.toFixed(2) + "%";
    document.getElementById('progressText').innerText =
      percent.toFixed(1) + "% of the journey to \"I Do\" 💗";
  }

  updateCountdown();
  const timer = setInterval(updateCountdown, 1000);

  // ================== Floating Sparkles ==================
  const sparkleChars = ['✦','✧','⭐','✨'];
  function createSparkle() {
    const el = document.createElement('div');
    el.classList.add('sparkle');
    el.innerText = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const duration = 7 + Math.random() * 6;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (10 + Math.random() * 14) + 'px';
    el.style.color = '#f7c98e';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }
  setInterval(createSparkle, 500);

  // ================== Falling Petals ==================
  const petalChars = ['🌸','🌺','💮'];
  function createPetal() {
    const el = document.createElement('div');
    el.classList.add('petal');
    el.innerText = petalChars[Math.floor(Math.random() * petalChars.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const duration = 8 + Math.random() * 6;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (14 + Math.random() * 12) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }
  setInterval(createPetal, 1400);
</script>

</body>
</html>
