<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eKickHub Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#07090f;--bg2:#0d1117;--bg3:#111827;--bg4:#1a2235;
  --cyan:#00e5ff;--green:#39ff14;--pink:#ff0066;--orange:#ff6b00;
  --gold:#ffd700;--purple:#a855f7;--red:#ff3b30;--blue:#3b82f6;
  --border:rgba(0,229,255,.1);--border2:rgba(255,255,255,.06);
  --txt:#ddeeff;--muted:#4a6a88;--muted2:#8aa4bb;
  --sidebar:220px;
  --font-d:'Orbitron',sans-serif;--font-b:'Exo 2',sans-serif;--font-r:'Rajdhani',sans-serif;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--font-b);display:flex;flex-direction:column}
.topbar{height:54px;background:rgba(7,9,15,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:200;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:14px}
.menu-btn{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:18px;padding:6px;border-radius:6px;transition:.2s;display:none}
.menu-btn:hover{color:var(--cyan);background:rgba(0,229,255,.08)}
.tb-logo{font-family:var(--font-d);font-size:16px;font-weight:900;letter-spacing:2px;text-decoration:none;display:flex;align-items:center;gap:2px}
.tb-logo .le{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-logo .hub{background:linear-gradient(90deg,var(--pink),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-logo .lk{color:#fff}
.tb-badge{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:2px;color:var(--bg);background:linear-gradient(90deg,var(--cyan),var(--green));padding:3px 9px;border-radius:3px;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:8px}
.tb-icon-btn{position:relative;width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--muted2);font-size:14px;cursor:pointer;transition:.2s}
.tb-icon-btn:hover{background:rgba(0,229,255,.08);border-color:var(--border);color:var(--cyan)}
.tb-notif{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--pink);border:2px solid var(--bg);font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.tb-avatar{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--bg);font-weight:700;cursor:pointer;border:2px solid rgba(0,229,255,.3);overflow:hidden}
.tb-avatar img{width:100%;height:100%;object-fit:cover}
.tb-user-info{display:flex;flex-direction:column;cursor:pointer}
.tb-user-info span:first-child{font-size:12px;font-weight:700;color:var(--txt)}
.tb-user-info span:last-child{font-size:10px;color:var(--muted2)}
@media(max-width:600px){.tb-user-info{display:none}}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;flex-shrink:0;transition:transform .3s ease;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.role-switcher{padding:16px 14px 12px}
.rs-label{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:block}
.rs-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--muted2);font-family:var(--font-b);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.rs-btn i{font-size:12px;width:16px;text-align:center}
.rs-btn:hover{background:rgba(0,229,255,.07);border-color:rgba(0,229,255,.2);color:var(--cyan)}
.rs-btn.active{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.35);color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.1)}
.rs-btn.role-mod.active{background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.35);color:var(--purple)}
.rs-btn.role-ref.active{background:rgba(255,107,0,.1);border-color:rgba(255,107,0,.35);color:var(--orange)}
.rs-btn.role-mgr.active{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.35);color:var(--gold)}
.rs-btn.role-player.active{background:rgba(57,255,20,.1);border-color:rgba(57,255,20,.35);color:var(--green)}
.sb-divider{height:1px;background:var(--border2);margin:4px 14px 8px}
.sb-nav{padding:0 10px;flex:1}
.sb-section-label{font-family:var(--font-d);font-size:7px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;padding:10px 6px 6px;display:block}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:2px;text-decoration:none;letter-spacing:.3px;position:relative}
.sb-item i{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.sb-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.sb-item.active{background:rgba(0,229,255,.08);color:var(--cyan);border-left:2px solid var(--cyan)}
.sb-item.active i{color:var(--cyan)}
.sb-badge{margin-left:auto;font-family:var(--font-d);font-size:8px;font-weight:700;padding:2px 7px;border-radius:10px}
.sb-badge.red{background:rgba(255,59,48,.15);color:var(--red);border:1px solid rgba(255,59,48,.3)}
.sb-badge.cyan{background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid rgba(0,229,255,.25)}
.sb-badge.gold{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.25)}
.sb-bottom{padding:12px 10px}
.sb-item.logout{color:rgba(255,59,48,.7)}
.sb-item.logout:hover{background:rgba(255,59,48,.1);color:var(--red)}
.main{flex:1;overflow-y:auto;background:var(--bg);scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.2) transparent}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:rgba(0,229,255,.2);border-radius:2px}
.page{display:none;padding:24px;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.pg-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.pg-title{font-family:var(--font-d);font-size:18px;font-weight:700;color:#fff;letter-spacing:1px}
.pg-sub{font-family:var(--font-b);font-size:12px;color:var(--muted2);margin-top:4px}
.pg-actions{display:flex;gap:8px;flex-wrap:wrap}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.stat-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:.3s;cursor:default}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sc-grad,linear-gradient(90deg,var(--cyan),var(--blue)));opacity:.7}
.stat-card:hover{border-color:rgba(0,229,255,.2);transform:translateY(-2px)}
.sc-icon{width:38px;height:38px;border-radius:9px;background:var(--sc-ibg,rgba(0,229,255,.1));display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--sc-color,var(--cyan));margin-bottom:12px}
.sc-val{font-family:var(--font-d);font-size:26px;font-weight:900;color:#fff;line-height:1}
.sc-label{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;margin-top:6px}
.sc-delta{position:absolute;top:16px;right:16px;font-family:var(--font-b);font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px}
.sc-delta.up{color:var(--green)}
.tbl-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.tbl-head{padding:16px 20px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.tbl-title{font-family:var(--font-d);font-size:12px;font-weight:700;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.tbl-title i{color:var(--cyan)}
.tbl-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:7px;padding:7px 12px;min-width:220px}
.tbl-search i{color:var(--muted);font-size:11px}
.tbl-search input{background:none;border:none;outline:none;color:var(--txt);font-family:var(--font-b);font-size:12px;flex:1}
.tbl-search input::placeholder{color:var(--muted)}
table{width:100%;border-collapse:collapse}
thead th{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--border2);text-align:left;white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:.15s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child{border-bottom:none}
td{padding:12px 16px;font-size:12px;vertical-align:middle}
.player-cell{display:flex;align-items:center;gap:10px}
.p-avatar{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg);font-weight:700;flex-shrink:0;overflow:hidden}
.p-avatar img{width:100%;height:100%;object-fit:cover}
.p-name{font-weight:700;color:var(--txt);font-size:12px}
.p-email{font-size:10px;color:var(--muted2)}
.pid{font-family:var(--font-d);font-size:10px;font-weight:700;color:var(--cyan)}
.badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:4px;text-transform:uppercase;margin:2px 2px 2px 0}
.badge-player{background:rgba(0,229,255,.12);color:var(--cyan);border:1px solid rgba(0,229,255,.25)}
.badge-admin{background:rgba(255,0,102,.12);color:var(--pink);border:1px solid rgba(255,0,102,.25)}
.badge-mod{background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.25)}
.badge-mgr{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.25)}
.badge-ref{background:rgba(255,107,0,.12);color:var(--orange);border:1px solid rgba(255,107,0,.25)}
.status-badge{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:1.5px;padding:4px 10px;border-radius:4px;text-transform:uppercase}
.st-approved{background:rgba(57,255,20,.12);color:var(--green);border:1px solid rgba(57,255,20,.25)}
.st-pending{background:rgba(255,215,0,.12);color:var(--gold);border:1px solid rgba(255,215,0,.25)}
.st-banned{background:rgba(255,59,48,.12);color:var(--red);border:1px solid rgba(255,59,48,.25)}
.action-btns{display:flex;gap:5px;flex-wrap:wrap}
.ab{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:1px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.ab-role{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.ab-role:hover{background:rgba(168,85,247,.3)}
.ab-email{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.ab-email:hover{background:rgba(59,130,246,.3)}
.ab-ban{background:rgba(255,107,0,.15);color:var(--orange);border:1px solid rgba(255,107,0,.3)}
.ab-ban:hover{background:rgba(255,107,0,.3)}
.ab-del{background:rgba(255,59,48,.15);color:var(--red);border:1px solid rgba(255,59,48,.3)}
.ab-del:hover{background:rgba(255,59,48,.3)}
.ab-approve{background:rgba(57,255,20,.15);color:var(--green);border:1px solid rgba(57,255,20,.3)}
.ab-approve:hover{background:rgba(57,255,20,.3)}
.ab-reject{background:rgba(255,59,48,.15);color:var(--red);border:1px solid rgba(255,59,48,.3)}
.ab-reject:hover{background:rgba(255,59,48,.3)}
.ab-primary{background:linear-gradient(90deg,var(--cyan),var(--blue));color:var(--bg);border:none}
.ab-primary:hover{box-shadow:0 4px 16px rgba(0,229,255,.35)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
@media(max-width:768px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid3{grid-template-columns:1fr}}
.panel{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel-title{font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.panel-title i{font-size:12px}
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.fin-row:last-child{border-bottom:none}
.fr-left{display:flex;align-items:center;gap:10px}
.fr-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.fr-label{font-size:12px;font-weight:600;color:var(--txt)}
.fr-sub{font-size:10px;color:var(--muted2)}
.fr-amount{font-family:var(--font-d);font-size:13px;font-weight:700}
.fr-amount.pos{color:var(--green)}
.fr-amount.neg{color:var(--red)}
.vc-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.vc-row:last-child{border-bottom:none}
.vc-info{flex:1}
.vc-name{font-size:12px;font-weight:700;color:var(--txt)}
.vc-meta{font-size:10px;color:var(--muted2)}
.vc-amount{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--gold);margin-right:12px}
.vc-grant-btn{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:1px;padding:5px 11px;border-radius:6px;cursor:pointer;background:rgba(255,215,0,.15);color:var(--gold);border:1px solid rgba(255,215,0,.3);transition:.2s}
.vc-grant-btn:hover{background:rgba(255,215,0,.3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:500px){.form-row{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-family:var(--font-d);font-size:8px;font-weight:700;letter-spacing:2px;color:var(--muted2);text-transform:uppercase}
.form-control{background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:7px;padding:9px 13px;color:var(--txt);font-family:var(--font-b);font-size:12px;outline:none;transition:.2s;appearance:none;-webkit-appearance:none}
.form-control:focus{border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.04)}
.form-control option{background:var(--bg3)}
.theme-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatch{width:32px;height:32px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.2s}
.swatch:hover,.swatch.active{border-color:#fff;transform:scale(1.1)}
.mini-chart{height:60px;display:flex;align-items:flex-end;gap:3px;padding:0 4px}
.bar{flex:1;border-radius:3px 3px 0 0;transition:height .5s ease;cursor:pointer;min-height:4px}
.bar:hover{opacity:.75}
.ads-zone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.ads-zone-grid{grid-template-columns:1fr 1fr}}
.az-card{background:rgba(255,255,255,.03);border:1px solid var(--border2);border-radius:8px;padding:14px;cursor:pointer;transition:.2s}
.az-card:hover{border-color:rgba(0,229,255,.25);background:rgba(0,229,255,.04)}
.az-card.active-zone{border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.08);box-shadow:0 0 16px rgba(0,229,255,.1)}
.az-icon{font-size:20px;margin-bottom:8px}
.az-name{font-family:var(--font-d);font-size:10px;font-weight:700;color:var(--txt);letter-spacing:.5px;margin-bottom:4px}
.az-count{font-size:10px;color:var(--muted2)}
.az-toggle{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted2)}
.toggle-sw{width:28px;height:14px;border-radius:7px;background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.3s}
.toggle-sw.on{background:rgba(57,255,20,.4)}
.toggle-sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:.3s}
.toggle-sw.on::after{left:16px;background:var(--green)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:500;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:440px;width:100%;position:relative;animation:modalIn .25s ease}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:var(--font-d);font-size:14px;font-weight:700;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted2);font-size:18px;cursor:pointer;transition:.2s}
.modal-close:hover{color:var(--pink)}
.role-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.role-check{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid var(--border2);cursor:pointer;transition:.2s}
.role-check.checked{background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.3)}
.role-check input{accent-color:var(--cyan)}
.role-check span{font-family:var(--font-b);font-size:12px;font-weight:600;color:var(--txt)}
#toast{position:fixed;bottom:20px;right:20px;z-index:9999;background:var(--bg3);border:1px solid var(--green);border-radius:9px;padding:12px 18px;font-family:var(--font-b);font-size:12px;color:var(--green);display:none;align-items:center;gap:9px;box-shadow:0 8px 28px rgba(57,255,20,.2);animation:tin .35s ease}
#toast.show{display:flex}
@keyframes tin{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.role-view-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:rgba(0,229,255,.06);border-bottom:1px solid rgba(0,229,255,.12);font-family:var(--font-d);font-size:9px;font-weight:700;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}
.tbl-wrap{overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.1) transparent}
.tbl-wrap::-webkit-scrollbar{height:3px}
.tbl-wrap::-webkit-scrollbar-thumb{background:rgba(0,229,255,.2)}
@media(max-width:768px){.menu-btn{display:flex}.sidebar{position:fixed;top:54px;left:0;bottom:0;z-index:300;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.stat-grid{grid-template-columns:1fr 1fr}table{font-size:11px}thead th,td{padding:9px 10px}.ads-zone-grid{grid-template-columns:1fr 1fr}}
@media(max-width:400px){.stat-grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.pg-title{font-size:15px}}
</style>
</head>
<body>
